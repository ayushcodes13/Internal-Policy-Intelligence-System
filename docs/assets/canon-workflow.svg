<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CANON workflow</title>
  <desc id="desc">A left to right workflow showing query, routing, retrieval, governance, and answer.</desc>
  <rect width="1280" height="520" rx="28" fill="#F4F0E6"/>
  <text x="72" y="88" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">The governed answer path</text>
  <text x="72" y="126" fill="#53606B" font-family="Inter, Arial, sans-serif" font-size="18">CANON makes the policy controls visible instead of hiding them behind a chatbot response.</text>
  <rect x="72" y="196" width="172" height="150" rx="18" fill="#101820"/>
  <text x="102" y="246" fill="#D8C58A" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">01 QUERY</text>
  <text x="102" y="288" fill="#F4F0E6" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">User asks a</text>
  <text x="102" y="316" fill="#F4F0E6" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">policy question</text>
  <path d="M260 271H326" stroke="#B9AE91" stroke-width="4" stroke-linecap="round"/>
  <path d="M314 259L326 271L314 283" stroke="#B9AE91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="342" y="196" width="172" height="150" rx="18" fill="#FFFFFF" stroke="#D7D1C1"/>
  <text x="372" y="246" fill="#8A6F28" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">02 ROUTE</text>
  <text x="372" y="288" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Find owner</text>
  <text x="372" y="316" fill="#53606B" font-family="Inter, Arial, sans-serif" font-size="15">Finance, Ops,</text>
  <text x="372" y="340" fill="#53606B" font-family="Inter, Arial, sans-serif" font-size="15">Security, Support</text>
  <path d="M530 271H596" stroke="#B9AE91" stroke-width="4" stroke-linecap="round"/>
  <path d="M584 259L596 271L584 283" stroke="#B9AE91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="612" y="196" width="172" height="150" rx="18" fill="#FFFFFF" stroke="#D7D1C1"/>
  <text x="642" y="246" fill="#8A6F28" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">03 RETRIEVE</text>
  <text x="642" y="288" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Search the</text>
  <text x="642" y="316" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">canonical index</text>
  <path d="M800 271H866" stroke="#B9AE91" stroke-width="4" stroke-linecap="round"/>
  <path d="M854 259L866 271L854 283" stroke="#B9AE91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="882" y="196" width="172" height="150" rx="18" fill="#FFFFFF" stroke="#D7D1C1"/>
  <text x="912" y="246" fill="#8A6F28" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">04 GOVERN</text>
  <text x="912" y="288" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Allow, refuse,</text>
  <text x="912" y="316" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">or escalate</text>
  <path d="M1070 271H1136" stroke="#B9AE91" stroke-width="4" stroke-linecap="round"/>
  <path d="M1124 259L1136 271L1124 283" stroke="#B9AE91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1152" y="196" width="56" height="150" rx="18" fill="#D8C58A"/>
  <text x="1172" y="286" fill="#101820" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" transform="rotate(90 1172 286)">ANSWER</text>
  <path d="M1152 346V374C1152 383 1145 390 1136 390H1080" stroke="#B9AE91" stroke-width="4" stroke-linecap="round"/>
  <rect x="950" y="390" width="258" height="58" rx="29" fill="#101820"/>
  <text x="997" y="426" fill="#F4F0E6" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Evidence-backed answer</text>
</svg>
